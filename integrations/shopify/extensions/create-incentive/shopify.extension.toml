[[extensions]]
name = "Create MSTRMND cart incentive"
description = "Create an automatic percentage discount above a minimum cart subtotal. Merchant reviews and confirms changes."
handle = "mstrmnd-create-incentive"
type = "admin_link"
[[extensions.targeting]]
target = "admin.app.intent.link"
url = "/shopify/discounts/new"
instructions = "./instructions.md"
[[extensions.targeting.intents]]
type = "shopify/Discount"
action = "create"
schema = "./discount-schema.json"
